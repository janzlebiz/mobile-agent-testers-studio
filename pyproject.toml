[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-agent-testers-studio"
version = "1.0.0"
description = "Autonomous AI mobile QA platform: parallel persona-driven testing on iOS & Android with interactive dashboard, Maestro regression export, crash telemetry, and CI/PR quality gates."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0.0",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=8.0"]

[project.scripts]
mat = "mat.cli:main"

[tool.setuptools.packages.find]
include = ["mat*"]
