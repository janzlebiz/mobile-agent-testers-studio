# Reusable / PR-triggered smoke test workflow.
# Runs a fast 2-persona sanity check (1 Android + 1 iOS) on pull requests
# when enabled via repository variable MAT_PR_SMOKE=true.
name: PR Smoke Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  smoke:
    if: vars.MAT_PR_SMOKE == 'true'
    uses: ./.github/workflows/agent-testers.yml
    with:
      android_personas: "malik"
      ios_personas: "clara"
      model: "haiku"
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
